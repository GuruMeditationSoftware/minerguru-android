<rect class="bg" x="0.5" y="0.5" width="1039" height="739" rx="16"/>
<text class="h" x="32" y="46">Android-App: Aufbau</text>
<text class="m" x="32" y="70">Zwei Wege in dieselben Dienste: MinerStore, solange die App sichtbar ist, und MinerMonitor im Hintergrund.</text>

<!-- Row 1 -->
<rect class="card" x="24" y="100" width="776" height="88" rx="12"/>
<text class="z" x="40" y="121">Einstieg · MainActivity.kt</text>
<rect class="raised" x="40" y="132" width="177" height="44" rx="8"/><text class="t" x="52" y="151">Eine Aktivität</text><text class="c" x="52" y="168">MainActivity</text>
<rect class="raised" x="229" y="132" width="177" height="44" rx="8"/><text class="t" x="241" y="151">Sichtbar: abfragen</text><text class="c" x="241" y="168">setForeground()</text>
<rect class="raised" x="418" y="132" width="177" height="44" rx="8"/><text class="t" x="430" y="151">Graphit-Design</text><text class="c" x="430" y="168">MinerGuruTheme</text>
<rect class="raised" x="607" y="132" width="177" height="44" rx="8"/><text class="t" x="619" y="151">Tipp aufs Widget</text><text class="c" x="619" y="168">pendingRoute</text>
<path class="ln" d="M412 188V204" marker-end="url(#ah)"/>

<!-- Row 2 -->
<rect class="card" x="24" y="206" width="776" height="88" rx="12"/>
<text class="z" x="40" y="227">Oberfläche · ui/ mit Navigation 3, NavigationSuiteScaffold, Liste und Detail</text>
<rect class="raised" x="40" y="238" width="114" height="44" rx="8"/><text class="t" x="97" y="257" text-anchor="middle">Übersicht</text><text class="c" x="97" y="274" text-anchor="middle">fleet</text>
<rect class="raised" x="166" y="238" width="114" height="44" rx="8"/><text class="t" x="223" y="257" text-anchor="middle">Miner</text><text class="c" x="223" y="274" text-anchor="middle">miner</text>
<rect class="raised" x="292" y="238" width="114" height="44" rx="8"/><text class="t" x="349" y="257" text-anchor="middle">Pools</text><text class="c" x="349" y="274" text-anchor="middle">pools</text>
<rect class="raised" x="418" y="238" width="114" height="44" rx="8"/><text class="t" x="475" y="257" text-anchor="middle">Strom</text><text class="c" x="475" y="274" text-anchor="middle">power</text>
<rect class="raised" x="544" y="238" width="114" height="44" rx="8"/><text class="t" x="601" y="257" text-anchor="middle">Wartung</text><text class="c" x="601" y="274" text-anchor="middle">maintenance</text>
<rect class="raised" x="670" y="238" width="114" height="44" rx="8"/><text class="t" x="727" y="257" text-anchor="middle">Einstellungen</text><text class="c" x="727" y="274" text-anchor="middle">settings</text>
<path class="ln" d="M412 294V310" marker-end="url(#ah)"/>

<!-- Row 3 -->
<rect class="card" x="24" y="312" width="776" height="132" rx="12"/>
<text class="z" x="40" y="333">Zustand · Compose-State im ViewModel</text>
<rect class="hot" x="40" y="344" width="260" height="84" rx="10"/>
<text class="b" x="56" y="368">MinerStore</text>
<text class="m" x="56" y="390">AndroidViewModel, Felder mit</text>
<text class="m" x="56" y="410">mutableStateOf, Abfrage alle 5 s</text>
<g class="c" text-anchor="middle">
<rect class="raised" x="316" y="344" width="150" height="26" rx="6"/><text x="391" y="361.5">BlockProbeStore</text>
<rect class="raised" x="475" y="344" width="150" height="26" rx="6"/><text x="550" y="361.5">UpdateChecker</text>
<rect class="raised" x="634" y="344" width="150" height="26" rx="6"/><text x="709" y="361.5">OtpSessions</text>
<rect class="raised" x="316" y="376" width="150" height="26" rx="6"/><text x="391" y="393.5">MinerLogStream</text>
<rect class="raised" x="475" y="376" width="309" height="26" rx="6"/><text x="629" y="393.5">ShareDifficultyTracker</text>
</g>
<text class="m" x="316" y="424">Live-Log und Share-Tracker leben je Detailseite.</text>
