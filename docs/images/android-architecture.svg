<!-- Row 5 -->
<rect class="card" x="24" y="610" width="776" height="96" rx="12"/>
<text class="z" x="40" y="631">Speicher · filesDir und SharedPreferences (minerguru, alerts, power, …), kein Cloud-Backup</text>
<rect class="raised" x="40" y="642" width="140" height="48" rx="8"/><text class="c" x="52" y="662">SharedPreferences</text><text class="m" x="52" y="680">Listen, Einstellungen</text>
