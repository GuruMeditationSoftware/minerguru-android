<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" role="img" aria-labelledby="t d">
<title id="t">MinerGuru Android: Aufbau</title>
<desc id="d">Fünf Schichten: Einstieg mit MainActivity, Compose-Oberfläche, Zustand im MinerStore-ViewModel, Dienste als object-Singletons und App-interner Speicher. Rechts die Hintergrund-Überwachung, die über MinerMonitor dieselben Dienste nutzt, und die Homescreen-Widgets, die einen Schnappschuss lesen.</desc>
